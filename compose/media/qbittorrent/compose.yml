name: qbittorrent
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:b024436f8ca665d16d9a997d26fd27fdf867ee5566ba09f32764e7b2976d3e02
    container_name: qbittorrent
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ${HOMESERVER_RUNTIME_ROOT:?required}/qbittorrent/config:/config
      - ${STORAGE_ROOT:?required}/torrents:/data/torrents
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    networks: [homeserver]
    dns: [8.8.8.8, 1.1.1.1]
networks:
  homeserver:
    name: ${HOMESERVER_DOCKER_NETWORK:-homeserver}
    external: true
