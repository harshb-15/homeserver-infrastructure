name: immich
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
    container_name: immich_server
    env_file:
      - "${HOMESERVER_PRIVATE_CONFIG_ROOT:?required}/stacks/immich.env"
    volumes:
      - ${UPLOAD_LOCATION:?required}:/data
      - /etc/localtime:/etc/localtime:ro
    ports: ["2283:2283"]
    depends_on: [redis, database]
    restart: unless-stopped
    healthcheck:
      disable: false
  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}@sha256:5a0839dc5303cd7215bcd2180a26aed3af41675aefb3e75e5157e9f10ad16e6e
    container_name: immich_machine_learning
    env_file:
      - "${HOMESERVER_PRIVATE_CONFIG_ROOT:?required}/stacks/immich.env"
    volumes: [model-cache:/cache]
    restart: unless-stopped
    healthcheck:
      disable: false
  redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich_redis
    healthcheck:
      test: [CMD, redis-cli, ping]
    restart: unless-stopped
  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      POSTGRES_USER: ${DB_USERNAME:?required}
      POSTGRES_DB: ${DB_DATABASE_NAME:?required}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: HDD
    volumes:
      - ${DB_DATA_LOCATION:?required}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
volumes:
  model-cache:
